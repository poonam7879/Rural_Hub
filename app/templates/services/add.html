{% extends "base.html" %}

{% block title %}Add Service - Rural Hub{% endblock %}

{% block content %}
<div style="max-width: 600px; margin: 0 auto; padding: 2rem; background: var(--bg-card); border-radius: var(--border-radius); box-shadow: var(--box-shadow);">
    <h2 class="mb-2">List a New Service</h2>
    
    <form method="POST" action="{{ url_for('services.add') }}">
        <div class="form-group">
            <label class="form-label" for="service_name">Service Name</label>
            <input type="text" id="service_name" name="service_name" class="form-control" placeholder="e.g. Tractor Repair, Plumbing" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="price">Estimated Price (₹)</label>
            <input type="number" step="0.01" min="0" id="price" name="price" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="location">Service Area / Location</label>
            <input type="text" id="location" name="location" class="form-control" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="availability">Availability</label>
            <input type="text" id="availability" name="availability" class="form-control" placeholder="e.g. Mon-Fri, 9AM-5PM" required>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="description">Detailed Description</label>
            <textarea id="description" name="description" class="form-control" rows="4" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">List Service</button>
    </form>
</div>
{% endblock %}
