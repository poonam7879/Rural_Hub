{% extends "base.html" %}

{% block title %}Register - Rural Hub{% endblock %}

{% block content %}
<div style="max-width: 550px; margin: 2rem auto; background: var(--bg-card); border-radius: var(--border-radius); box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden;">
    <div style="background: url('https://images.unsplash.com/photo-1592982537447-6f2a6a0d6c10?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80') center/cover; height: 150px; display: flex; align-items: center; justify-content: center; position: relative;">
        <div style="position: absolute; inset: 0; background: rgba(255, 152, 0, 0.7);"></div>
        <h2 style="color: white; margin: 0; position: relative; z-index: 1;">Join Rural Hub</h2>
    </div>
    
    <div style="padding: 2rem;">
        <form method="POST" action="{{ url_for('auth.register') }}">
            <div class="form-group">
                <label class="form-label" for="name">Full Name</label>
                <input type="text" id="name" name="name" class="form-control" placeholder="e.g. Ramesh Kumar" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="you@example.com" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="mobile">Mobile Number</label>
                <input type="text" id="mobile" name="mobile" class="form-control" placeholder="e.g. +91 9876543210" required>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="role">I want to register as a:</label>
                <select id="role" name="role" class="form-control" required style="border-left: 4px solid var(--secondary-color);">
                    <option value="user">Regular User (Sell Scrap, Book Services, Barter)</option>
                    <option value="dealer">Scrap Dealer (Bid on Scrap)</option>
                    <option value="service_provider">Service Provider (Offer Services)</option>
                </select>
            </div>
            
            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 6 characters" required minlength="6">
            </div>
            
            <button type="submit" class="btn btn-secondary" style="width: 100%; font-size: 1.1rem;">Create Account</button>
        </form>
        
        <div class="text-center mt-2">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}" style="font-weight: 600; color: var(--secondary-dark);">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
